version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: smartprior-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smartprior_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    container_name: smartprior-backend
    restart: always
    environment:
      PORT: 4000
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/smartprior_db?schema=public
      JWT_SECRET: dev_jwt_secret
    ports:
      - '4000:4000'
    depends_on:
      - postgres

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    container_name: smartprior-frontend
    restart: always
    ports:
      - '3000:3000'
    environment:
      VITE_API_BASE_URL: http://localhost:4000/api/v1
    depends_on:
      - backend

volumes:
  postgres_data:
