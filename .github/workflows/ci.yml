name: SmartPrior AI CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smartprior_db
        options: >-
          --health-cmd "pg_isready -U postgres -d smartprior_db -h localhost -p 5432"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/smartprior_db?schema=public

    strategy:
      matrix:
        node-version: [20.x]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Generate ephemeral CI JWT secret
        id: generate-jwt
        shell: bash
        run: |
          # Generate a cryptographically secure random secret (32 bytes -> 64 hex chars)
          JWT_SECRET="$(openssl rand -hex 32)"

          # Validate length (at least 32 characters)
          if [ "${#JWT_SECRET}" -lt 32 ]; then
            echo "Generated JWT secret is too short" >&2
            exit 1
          fi

          # Persist secret to the job environment without printing it
          echo "JWT_ACCESS_SECRET=$JWT_SECRET" >> "$GITHUB_ENV"
          echo "Generated ephemeral CI JWT secret"

      - name: Validate Prisma Schema
        run: npm run prisma:validate

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Apply Prisma migrations
        working-directory: backend
        run: npx prisma migrate deploy

      - name: Run ESLint
        run: npm run lint

      - name: Run Type Checking
        run: npm run type-check

      - name: Run Backend & Frontend Tests
        run: npm run test

      - name: Build Backend
        run: npm run build:backend

      - name: Build Frontend
        run: npm run build:frontend